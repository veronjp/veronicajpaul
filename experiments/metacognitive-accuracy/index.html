---
layout: default
title: Metacognitive Accuracy
---

<style>
  /* Scoped to this experiment only: every rule starts with
     .metacognitive-experiment, so nothing here affects other pages.
     Colours come from the site's existing variables. */

  .metacognitive-experiment .metacognitive-form__field {
    margin: 0 0 var(--space-5);
  }

  .metacognitive-experiment .metacognitive-form__label {
    display: block;
    margin: 0 0 var(--space-2);
    font-family: var(--font-mono);
    font-size: 0.875rem;
    line-height: 1.5;
    color: var(--color-ink);
  }

  /* A clear box: white background, navy border, comfortable padding.
     The font size stays above 16px so phones do not zoom in on focus. */
  .metacognitive-experiment .metacognitive-form__input {
    display: block;
    width: 100%;
    max-width: 16rem;
    min-height: 2.75rem;
    margin: 0;
    padding: var(--space-3) var(--space-4);
    border: 2px solid var(--color-orange);
    border-radius: 0;
    background: #ffffff;
    color: var(--color-ink);
    font-family: var(--font-body);
    font-size: 1.1875rem;
    line-height: 1.4;
  }

  /* Focus: the border turns purple and a purple ring appears for
     keyboard users, so the active field is obvious. */
  .metacognitive-experiment .metacognitive-form__input:focus {
    border-color: var(--color-green);
  }

  .metacognitive-experiment .metacognitive-form__input:focus-visible {
    outline: 3px solid var(--color-green);
    outline-offset: 2px;
  }

  /* Outlined purple button that fills on hover. */
  .metacognitive-experiment .metacognitive-form__button {
    min-height: 2.75rem;
    margin: var(--space-2) 0 0;
    padding: var(--space-2) var(--space-6);
    border: 2px solid var(--color-green);
    border-radius: 0;
    background: transparent;
    color: var(--color-green);
    font-family: var(--font-body);
    font-size: 1rem;
    font-weight: 600;
    line-height: 1.3;
    cursor: pointer;
  }

  .metacognitive-experiment .metacognitive-form__button:hover {
    background: var(--color-green);
    color: #ffffff;
  }

  .metacognitive-experiment .metacognitive-form__button:focus-visible {
    outline: 3px solid var(--color-orange);
    outline-offset: 3px;
  }

  /* The result sits under the button with a purple rule on its left.
     It stays hidden until there is text to show. */
  .metacognitive-experiment .metacognitive-result {
    display: block;
    margin-top: var(--space-6);
    padding-left: var(--space-4);
    border-left: 3px solid var(--color-green);
    font-family: var(--font-mono);
    font-size: 0.9375rem;
    line-height: 1.6;
    color: var(--color-ink);
  }

  .metacognitive-experiment .metacognitive-result:empty {
    display: none;
  }

  /* Phones: the fields and button fill the width. */
  @media (max-width: 34rem) {
    .metacognitive-experiment .metacognitive-form__input {
      max-width: none;
    }

    .metacognitive-experiment .metacognitive-form__button {
      width: 100%;
    }
  }
</style>

<header class="page-header">
  <h1 class="page-header__title">How Accurate Is Your Thinking?</h1>
  <p class="page-header__intro">Explore how accurately you estimate your performance before and after using AI.</p>
</header>

<section class="metacognitive-experiment" aria-labelledby="metacognitive-accuracy-heading">
  <h2 id="metacognitive-accuracy-heading">Metacognitive Accuracy Demonstration</h2>

  <p class="metacognitive-form__field">
    <label class="metacognitive-form__label" for="before">Estimated score before AI:</label>
    <input class="metacognitive-form__input" type="number" id="before" min="0" max="10">
  </p>

  <p class="metacognitive-form__field">
    <label class="metacognitive-form__label" for="after">Estimated score after AI:</label>
    <input class="metacognitive-form__input" type="number" id="after" min="0" max="10">
  </p>

  <p class="metacognitive-form__field">
    <label class="metacognitive-form__label" for="actual">Actual score:</label>
    <input class="metacognitive-form__input" type="number" id="actual" min="0" max="10">
  </p>

  <button class="metacognitive-form__button" type="button" id="calculate">Calculate Accuracy</button>

  <output class="metacognitive-result" id="result" for="before after actual"></output>
</section>

<script>
  const button = document.getElementById("calculate");
  const result = document.getElementById("result");

  button.addEventListener("click", function() {
    const before = Number(document.getElementById("before").value);
    const after = Number(document.getElementById("after").value);
    const actual = Number(document.getElementById("actual").value);

    const inputs = ["before", "after", "actual"];

    const invalid = inputs.some(function(id) {
      const field = document.getElementById(id);
      const value = Number(field.value);

      return field.value.trim() === "" ||
             !Number.isFinite(value) ||
             value < 0 ||
             value > 10 ||
             !Number.isInteger(value);
    });

    if (invalid) {
      result.textContent =
        "Please enter a whole number between 0 and 10 in every field.";
      return;
    }

    const beforeError = Math.abs(before - actual);
    const afterError = Math.abs(after - actual);

    let outcome;

    if (afterError < beforeError) {
      outcome = "Improved";
    } else if (afterError > beforeError) {
      outcome = "Deteriorated";
    } else {
      outcome = "No change";
    }

    result.textContent =
      "Before error: " + beforeError +
      " | After error: " + afterError +
      " | Accuracy: " + outcome;
  });
</script>
