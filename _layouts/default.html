<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_html | strip | escape }}">

  <!-- Lets the stylesheet know JavaScript is available (used by the mobile menu). -->
  <script>document.documentElement.classList.add("js");</script>

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>

  <div class="site-frame">
    {% include header.html %}

    <main id="main-content">
      {{ content }}
    </main>

    {% include footer.html %}
  </div>

  <script src="{{ '/assets/js/nav.js' | relative_url }}" defer></script>
</body>
</html>
