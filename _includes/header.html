{% comment %}
  The current section gets aria-current="page", which is styled as the active link.
  Posts count as Writing, and anything under /experiments/ counts as Experiments.
{% endcomment %}
{% assign here = page.url %}
<header class="site-header">
  <a class="site-name" href="{{ '/' | relative_url }}">Veronica J. Paul</a>

  <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">Menu</button>

  <nav class="site-nav" id="site-nav" aria-label="Primary">
    <ul class="site-nav__list">
      <li><a class="site-nav__link" href="{{ '/about/' | relative_url }}"{% if here contains '/about/' %} aria-current="page"{% endif %}>About</a></li>
      <li><a class="site-nav__link" href="{{ '/research/' | relative_url }}"{% if here contains '/research/' %} aria-current="page"{% endif %}>Research</a></li>
      <li><a class="site-nav__link" href="{{ '/experiments/' | relative_url }}"{% if here contains '/experiments/' %} aria-current="page"{% endif %}>Experiments</a></li>
      <li><a class="site-nav__link" href="{{ '/writing/' | relative_url }}"{% if here contains '/writing/' or page.path contains '_posts/' %} aria-current="page"{% endif %}>Writing</a></li>
    </ul>
  </nav>
</header>
