---
layout: default
title: Contact
description: Send a message to Veronica J. Paul.
---

<header class="page-header">
  <p class="page-header__label">contact</p>
  <h1 class="page-header__title">Contact</h1>
  <p class="page-header__intro">Questions, ideas, or collaboration? Send a message using the form below.</p>
</header>

<section class="contact" aria-label="Contact form">
  <!-- Messages are sent to Formspree, which forwards them to the email address set up in the Formspree dashboard. -->
  <form class="contact-form" action="https://formspree.io/f/xaeqqbgr" method="POST">
    <p class="contact-form__field">
      <label class="contact-form__label" for="contact-name">Name</label>
      <input class="contact-form__input" type="text" id="contact-name" name="name" autocomplete="name" required>
    </p>

    <p class="contact-form__field">
      <label class="contact-form__label" for="contact-email">Email</label>
      <input class="contact-form__input" type="email" id="contact-email" name="email" autocomplete="email" required>
    </p>

    <p class="contact-form__field">
      <label class="contact-form__label" for="contact-message">Message</label>
      <textarea class="contact-form__input contact-form__textarea" id="contact-message" name="message" rows="5" required></textarea>
    </p>

    <button class="contact-form__button" type="submit">Send <span aria-hidden="true">→</span></button>
  </form>
</section>
